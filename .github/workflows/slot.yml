# 1/3 — Research + script at each slot, then ask for approval (GitHub issue + ntfy).
name: Slot - write script
on:
  schedule:            # GitHub cron is UTC and can start late (even hours); each slot has 3 tries,
                       # the first one that runs does the work, the others see the review issue and stop.
    - cron: "50 0 * * *"    # 06:20 IST  \
    - cron: "15 1 * * *"    # 06:45 IST   > 8 AM Short (cut-off 07:20)
    - cron: "40 1 * * *"    # 07:10 IST  /
    - cron: "50 8 * * *"    # 14:20 IST  \
    - cron: "25 9 * * *"    # 14:55 IST   > 4 PM Short (cut-off 15:40)
    - cron: "55 9 * * *"    # 15:25 IST  /
    - cron: "50 13 * * *"   # 19:20 IST  \
    - cron: "20 14 * * *"   # 19:50 IST   > 9 PM Short (cut-off 20:20)
    - cron: "45 14 * * *"   # 20:15 IST  /
  workflow_dispatch:
    inputs:
      slot: {description: "am | pm | night (blank = by time)", required: false, default: ""}
      skip_wait: {description: "Start now (do not wait for the news cut-off)", type: boolean, default: false}
      post_now: {description: "Post as soon as I approve (manual run, not tied to a slot time)", type: boolean, default: false}

permissions: {contents: write, issues: write}
concurrency:
  group: slot-${{ github.ref }}
  cancel-in-progress: false

jobs:
  script:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      PYTHONIOENCODING: utf-8
      GH_TOKEN: ${{ github.token }}
      NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - name: Which slot
        id: s
        run: python bot/slot.py detect "${{ inputs.slot }}" >> "$GITHUB_OUTPUT"
      - name: Already done, or too late?
        id: go
        run: |
          if [ "${{ steps.s.outputs.skip }}" = "true" ]; then
            echo "GitHub started this run outside every slot window - nothing to do."; echo "go=false" >> "$GITHUB_OUTPUT"; exit 0; fi
          KEY="${{ steps.s.outputs.date }}-${{ steps.s.outputs.slot }}"
          if [ "${{ inputs.skip_wait || inputs.post_now }}" != "true" ] && python bot/slot.py too-early ${{ steps.s.outputs.slot }}; then
            echo "Too early for the ${{ steps.s.outputs.slot }} slot - nothing to do yet."; echo "go=false" >> "$GITHUB_OUTPUT"; exit 0; fi
          if [ "${{ inputs.skip_wait || inputs.post_now }}" != "true" ] && ! python bot/slot.py window ${{ steps.s.outputs.slot }} ${{ steps.s.outputs.date }}; then
            echo "Too late for the ${{ steps.s.outputs.slot }} slot today."; echo "go=false" >> "$GITHUB_OUTPUT"; exit 0; fi
          # timers (GitHub's own or the external alarm clock) never make a second Short for the same slot;
          # a manual test with "Start now" ticked is always allowed
          if [ "${{ inputs.skip_wait || inputs.post_now }}" != "true" ] && gh issue list --state all --search "[$KEY] in:title" --json title -q '.[].title' | grep -qF "[$KEY]"; then
            echo "The $KEY Short is already written - this extra try stops here."; echo "go=false" >> "$GITHUB_OUTPUT"; exit 0; fi
          echo "go=true" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@v4
        if: steps.go.outputs.go == 'true'
        with: {node-version: "22"}
      - name: Install
        if: steps.go.outputs.go == 'true'
        run: |
          pip install -q -r requirements.txt
          npm install -g -s @anthropic-ai/claude-code
      - name: Wait for the news cut-off
        if: steps.go.outputs.go == 'true' && !(inputs.skip_wait || inputs.post_now)
        run: python bot/slot.py wait-cutoff ${{ steps.s.outputs.slot }}
      - name: Research (Trend Scout + full articles)
        if: steps.go.outputs.go == 'true'
        run: python bot/research.py ${{ steps.s.outputs.slot }}
      - name: Claude writes the script, code checks it
        id: w
        if: steps.go.outputs.go == 'true'
        run: |
          python bot/build_script.py media
          if python bot/write.py ${{ steps.s.outputs.slot }}; then echo "ok=true" >> "$GITHUB_OUTPUT"; else echo "ok=false" >> "$GITHUB_OUTPUT"; fi
      - name: Build kit + review page
        if: steps.go.outputs.go == 'true'
        run: |
          python bot/build_script.py build ${{ steps.s.outputs.slot }} || true
          KEY="${{ steps.s.outputs.date }}-${{ steps.s.outputs.slot }}"
          if [ "${{ inputs.post_now }}" = "true" ]; then KEY="$KEY-manual-$(TZ=Asia/Kolkata date +%H%M)"; fi
          KEY="$KEY" POST_NOW="${{ inputs.post_now }}" python bot/review.py ${{ steps.s.outputs.slot }} ${{ steps.s.outputs.date }}
          echo "KEY=$KEY" >> "$GITHUB_ENV"
      - name: Save state + open review issue + notify
        if: steps.go.outputs.go == 'true'
        run: |
          bash bot/state.sh push "$KEY"
          gh label create short-review --color FF5722 --force >/dev/null
          URL=$(gh issue create --label short-review --title "[$KEY] Short for review" --body-file run/review.md)
          echo "Review: $URL"
          python bot/notify.py "StickBiz ${{ steps.s.outputs.post }} Short: please review" run/notify.md \
            --click "$URL" --action "Review & reply|$URL" --tags clapper --priority 4
      - name: Tell me if something broke
        if: failure()
        run: python bot/notify.py "StickBiz bot FAILED (script step)" "Open ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" --priority 5 --tags warning
